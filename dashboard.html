<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard | CCP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark terminal-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html">> CCP</a><a class="btn btn-terminal btn-sm" href="complaint.html">Report</a></div></nav><main class="container py-5"><p class="terminal-label">STUDENT DASHBOARD</p><h1 class="mb-4">My Complaints</h1><div id="dashCards" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=CCP.getComplaints();document.getElementById('dashCards').innerHTML=c.slice(0,6).map(x=>`<div class="terminal-card p-4"><div class="text-gray-400">${CCP.escape(x.id)}</div><h3>${CCP.escape(x.title)}</h3><span class="badge-status ${x.status==='Resolved'?'status-resolved':x.status==='In Progress'?'status-progress':'status-pending'}">${CCP.escape(x.status)}</span><p class="small text-secondary mt-2">${CCP.escape(x.category)} • ${CCP.escape(x.date)}</p></div>`).join('')||'<p class="text-secondary">No complaints yet.</p>';});</script></body></html>
