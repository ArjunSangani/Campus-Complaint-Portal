<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Submit Complaint | CCP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark terminal-nav sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="prompt">></span> CCP</a><div><a class="nav-link d-inline-block" href="history.html">Track</a><a class="btn btn-sm btn-terminal" href="admin.html">Admin</a></div></div></nav>
<main class="container py-5"><div class="row g-4">
<div class="col-lg-8"><div class="terminal-card p-4">
<p class="terminal-label">TICKET CREATION</p><h1>Submit a Complaint</h1>
<form id="complaintForm" novalidate>
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Student Name *</label><input id="studentName" class="form-control terminal-input" required></div>
<div class="col-md-6"><label class="form-label">Enrollment No. *</label><input id="enrollment" class="form-control terminal-input" required></div>
<div class="col-md-6"><label class="form-label">Email *</label><input id="email" type="email" class="form-control terminal-input" required></div>
<div class="col-md-6"><label class="form-label">Mobile *</label><input id="mobile" type="tel" pattern="[0-9]{10}" class="form-control terminal-input" placeholder="10 digits" required></div>
<div class="col-md-6"><label class="form-label">Department *</label><select id="department" class="form-select terminal-input" required><option value="">Select</option><option>Computer Engineering</option><option>IT</option><option>Mechanical</option><option>Civil</option><option>Electrical</option></select></div>
<div class="col-md-6"><label class="form-label">Semester *</label><select id="semester" class="form-select terminal-input" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<div class="col-md-6"><label class="form-label">Category *</label><select id="category" class="form-select terminal-input" required><option value="">Select</option><option>Classroom</option><option>Laboratory</option><option>Wi-Fi</option><option>Library</option><option>Hostel</option><option>Canteen</option><option>Transport</option><option>Washroom</option><option>Electricity</option><option>Water Supply</option><option>Parking</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label">Priority *</label><select id="priority" class="form-select terminal-input" required><option>Low</option><option selected>Medium</option><option>High</option></select></div>
<div class="col-12"><label class="form-label">Complaint Title *</label><input id="title" maxlength="80" class="form-control terminal-input" required></div>
<div class="col-12"><label class="form-label">Description *</label><textarea id="description" maxlength="500" rows="5" class="form-control terminal-input" required></textarea><div class="small text-secondary text-end"><span id="charCount">0</span>/500</div></div>
<div class="col-md-6"><label class="form-label">Date</label><input id="complaintDate" type="date" class="form-control terminal-input"></div>
<div class="col-md-6"><label class="form-label">Image (optional)</label><input id="image" type="file" accept="image/*" class="form-control terminal-input"></div>
<div class="col-12 form-check ms-2"><input id="terms" class="form-check-input" type="checkbox" required><label class="form-check-label" for="terms">I confirm that the information provided is correct.</label></div>
</div>
<button class="btn btn-terminal mt-4">Submit Complaint</button><p id="complaintMsg" class="mt-3"></p>
</form></div></div>
<div class="col-lg-4"><aside class="terminal-card p-4 sticky-lg-top" style="top:90px"><p class="terminal-label">STATUS FLOW</p><div class="status-flow"><div><b>01</b> Submitted</div><div><b>02</b> Pending Review</div><div><b>03</b> In Progress</div><div><b>04</b> Resolved</div></div><hr><p class="small text-secondary mb-0">Your complaint ID is generated automatically. Keep it for tracking.</p></aside></div>
</div></main><script src="js/app.js"></script><script src="js/complaint.js"></script></body></html>
