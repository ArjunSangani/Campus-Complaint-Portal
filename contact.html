<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | CCP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark terminal-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html">> CCP</a></div></nav><main class="container py-5"><div class="row g-4"><div class="col-lg-6"><div class="terminal-card p-4"><p class="terminal-label">CONTACT DESK</p><h1>Send a Message</h1><form id="contactForm"><input class="form-control terminal-input mb-3" placeholder="Name" required><input type="email" class="form-control terminal-input mb-3" placeholder="Email" required><textarea class="form-control terminal-input mb-3" rows="5" placeholder="Message" required></textarea><button class="btn btn-terminal">Send</button></form></div></div><div class="col-lg-6"><div class="terminal-card p-4 h-100"><h3>Campus Support</h3><p class="text-secondary">For urgent issues, contact the college administration office directly.</p><div class="ratio ratio-16x9 rounded overflow-hidden"><iframe title="Campus map" src="https://www.openstreetmap.org/export/embed.html?bbox=70.75%2C22.25%2C70.85%2C22.35&amp;layer=mapnik"></iframe></div></div></div></div></main><script>document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();alert('Message submitted successfully.');e.target.reset();});</script></body></html>
