<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CCP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark terminal-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="prompt">></span> CCP</a><a class="btn btn-sm btn-outline-light" href="index.html">Home</a></div></nav>
<main class="auth-wrap">
  <div class="terminal-card auth-card">
    <p class="terminal-label">USER AUTHENTICATION</p><h1>Login</h1>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control terminal-input" id="loginEmail" type="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control terminal-input" id="loginPassword" type="password" minlength="4" required></div>
      <div class="form-check mb-3"><input class="form-check-input" id="remember" type="checkbox"><label class="form-check-label" for="remember">Remember me</label></div>
      <button class="btn btn-terminal w-100" type="submit">Login</button>
      <p id="loginMsg" class="mt-3 small"></p>
    </form>
    <hr><p class="small text-secondary mb-0">Demo admin: <b>admin@ccp.local</b> / <b>admin123</b></p>
  </div>
</main>
<script src="js/app.js"></script><script src="js/login.js"></script>
</body></html>
