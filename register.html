<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CCP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark terminal-nav">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><span class="prompt">></span> CCP</a>
        <a class="btn btn-sm btn-outline-light" href="login.html">Login</a>
    </div>
</nav>

<main class="auth-wrap">
    <div class="terminal-card auth-card">
        <p class="terminal-label">NEW STUDENT</p>
        <h1>Create Account</h1>
        <form id="registerForm" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input id="regName" class="form-control terminal-input" placeholder="e.g. Rahul Sharma" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Enrollment No.</label>
                    <input id="regEnrollment" class="form-control terminal-input" placeholder="e.g. 21010101001" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input id="regEmail" type="text" class="form-control terminal-input" placeholder="student@example.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input id="regPhone" type="text" class="form-control terminal-input" placeholder="10-digit mobile" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Department</label>
                    <select id="regDept" class="form-select terminal-input" required>
                        <option value="">Select</option>
                        <option>Computer Engineering</option>
                        <option>IT</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                        <option>Electrical</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Semester</label>
                    <select id="regSem" class="form-select terminal-input" required>
                        <option value="">Select</option>
                        <option>1</option><option>2</option><option>3</option><option>4</option>
                        <option>5</option><option>6</option><option>7</option><option>8</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input id="regPassword" type="password" class="form-control terminal-input" placeholder="Min 8 chars (Uppercase, lowercase, digit, special char)" required>
                </div>
            </div>

            <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="enableAlert" checked>
                <label class="form-check-label small text-secondary" for="enableAlert">
                    Show Alert popup for JS Validation (useful for screenshots)
                </label>
            </div>

            <button type="submit" class="btn btn-terminal w-100 mt-3">Register</button>
            <div id="registerMsg" class="mt-3"></div>
            <p class="mt-3 text-center small text-secondary">
                Already have an account? <a href="login.html" class="text-decoration-none" style="color:var(--green)">Login here</a>
            </p>
        </form>
    </div>
</main>

<script src="js/app.js"></script>
<script src="js/register.js"></script>
</body>
</html>
