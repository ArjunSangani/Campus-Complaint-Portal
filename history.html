<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Track Complaints | CCP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark terminal-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="prompt">></span> CCP</a><a class="btn btn-terminal btn-sm" href="complaint.html">+ New Complaint</a></div></nav>
<main class="container py-5"><div class="section-heading"><p class="terminal-label">TRACKING CONSOLE</p><h1>Complaint History</h1></div>
<div class="terminal-card p-3 mb-4"><div class="row g-2"><div class="col-lg-5"><input id="searchBox" class="form-control terminal-input" placeholder="Search ID, title, category..."></div><div class="col-md-4 col-lg-3"><select id="statusFilter" class="form-select terminal-input"><option value="">All Statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select></div><div class="col-md-4 col-lg-3"><select id="categoryFilter" class="form-select terminal-input"><option value="">All Categories</option></select></div><div class="col-md-4 col-lg-1"><button id="clearFilters" class="btn btn-outline-light w-100" title="Clear filters">↺</button></div></div></div>
<div id="complaintList" class="row g-3"></div>
</main><div class="modal fade" id="detailModal"><div class="modal-dialog modal-lg"><div class="modal-content terminal-modal"><div class="modal-header"><h5 class="modal-title">Complaint Details</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body" id="detailBody"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/history.js"></script></body></html>
