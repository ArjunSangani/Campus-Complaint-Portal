<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Dashboard | CCP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar navbar-dark terminal-nav"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="prompt">></span> CCP / ADMIN</a><div><a class="btn btn-sm btn-outline-light me-2" href="history.html">Student View</a><button id="logoutBtn" class="btn btn-sm btn-terminal">Logout</button></div></div></nav>
<main class="container py-5">
<div class="d-flex justify-content-between align-items-end mb-4"><div><p class="terminal-label">ADMIN CONSOLE</p><h1>Complaint Dashboard</h1></div><button id="seedBtn" class="btn btn-outline-light btn-sm">Load Demo Data</button></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
<div class="terminal-card p-4"><div class="text-3xl font-bold accent" id="aTotal">0</div><div class="text-gray-400">Total</div></div>
<div class="terminal-card p-4"><div class="text-3xl font-bold" id="aPending">0</div><div class="text-gray-400">Pending</div></div>
<div class="terminal-card p-4"><div class="text-3xl font-bold" id="aProgress">0</div><div class="text-gray-400">In Progress</div></div>
<div class="terminal-card p-4"><div class="text-3xl font-bold" id="aResolved">0</div><div class="text-gray-400">Resolved</div></div>
</div>
<div class="terminal-card p-3 mb-4"><div class="row g-2"><div class="col-md-5"><input id="adminSearch" class="form-control terminal-input" placeholder="Search complaint..."></div><div class="col-md-3"><select id="adminStatus" class="form-select terminal-input"><option value="">All Statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select></div><div class="col-md-4"><select id="adminCategory" class="form-select terminal-input"><option value="">All Categories</option></select></div></div></div>
<div class="table-responsive terminal-card p-2"><table class="table table-dark table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Student</th><th>Category</th><th>Priority</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminTable"></tbody></table></div>
</main>
<script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
